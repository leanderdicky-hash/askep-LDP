function blob(){const f=S.f;let x=[f.kel,f.sub,f.obj].join(" ");const n=+f.n,r=+f.rr,h=+f.sh,s=+f.sp,td=(f.td||"").split("/").map(Number);

h+=`<div class="card"><h3>${d.n}</h3>`+(d.e.length?`<p class="lb">Berhubungan dengan (etiologi)</p>`+d.e.map(e=>`<label class="ck"><input type="radio" name="et" value="${esc(e)}" ${S.et==e?"checked":""} onchange="S.et=this.value;save();up()"> ${e}</label>`).join(""):"")
+`<p class="lb">${d.r?"Faktor risiko":"Tanda dan gejala mayor"} (centang yang ditemukan)</p>`+sgs(d.mj)+(d.mn.length?`<p class="lb">Tanda dan gejala minor</p>`+sgs(d.mn):"")
+`<p class="lb">Rumusan diagnosa</p><div class="pes" id="pes">${esc(pes())}</div></div>`}
return h}
function v2(){const d=D[S.dx],x=d.sl;return `<div class="card"><h2>Luaran (SLKI)</h2><p><b>${x[1]}</b> <code>${x[0]}</code></p><p class="lb">Kriteria hasil yang dijadikan target</p>`+x[2].map((c,j)=>`<label class="ck"><input type="checkbox" value="${j}" ${S.ou.includes(""+j)?"checked":""} onchange="tg('ou',this.value)"> ${c}</label>`).join("")+`<p class="mu" style="margin-top:12px">Evaluasi target dan aktual memakai skala 1 sampai 5 sesuai definisi SLKI.</p></div>`}
function v3(){const d=D[S.dx];return `<div class="card"><h2>Intervensi (SIKI)</h2>`+d.si.map((x,a)=>`<h3>${x[1]} <code>${x[0]}</code></h3>`+x[2].map((t,j)=>`<label class="ck"><input type="checkbox" value="${a}-${j}" ${S.iv.includes(a+"-"+j)?"checked":""} onchange="tg('iv',this.value)"> ${t}</label>`).join("")).join("")+`</div>`}
const ivl=a=>S.iv.filter(v=>v.startsWith(a+"-")).map(v=>D[S.dx].si[a][2][v.split("-")[1]]);
function mk(){const f=S.f,d=D[S.dx];
S.so={s:`Pasien ${f.ini||""}${f.usia?`, ${f.usia} tahun,`:""} mengeluh ${f.kel||"…"}. ${f.sub||""}`.trim(),
o:`TTV: TD ${f.td||"-"} mmHg, N ${f.n||"-"} x/mnt, RR ${f.rr||"-"} x/mnt, suhu ${f.sh||"-"} °C, SpO₂ ${f.sp||"-"}%. ${f.obj||""}`.trim(),
a:`${pes()} (SDKI ${d.c}). Luaran: ${d.sl[1]} (${d.sl[0]}), target ${S.ou.map(j=>d.sl[2][j].toLowerCase()).join("; ")}.`,
p:d.si.map((x,a)=>`${x[1]} (${x[0]}): ${ivl(a).join("; ")}`).join("\n")}}
function v4(){const so=S.so,t=(k,l)=>`<label>${l}<textarea rows="4" oninput="S.so.${k}=this.value;save()">${esc(so[k])}</textarea></label>`;
return `<div class="card"><h2>Catatan SOAP</h2><p class="mu">Disusun otomatis dari data Anda. Edit sesuai kondisi pasien, lalu tambahkan evaluasi per shift pada kolom Planning.</p>${t("s","S (Subjective)")}${t("o","O (Objective)")}${t("a","A (Assessment)")}${t("p","P (Planning)")}<button class="g" onclick="mk();render(1)">Susun ulang dari data</button></div>`}
function docT(){const f=S.f,d=D[S.dx];if(!d)return"";
return [`ASUHAN KEPERAWATAN (${BRAND.initials})`,`Pasien: ${f.ini||"-"}, ${f.usia||"-"} tahun, ${f.jk||"-"}`,"",`DIAGNOSA (SDKI ${d.c}; NANDA-I ${d.nd})`,pes(),"",`LUARAN (SLKI ${d.sl[0]} ${d.sl[1]})`,...S.ou.map(j=>"- "+d.sl[2][j]),"","INTERVENSI (SIKI)",...d.si.flatMap((x,a)=>[x[1]+" ("+x[0]+")",...ivl(a).map(t=>"- "+t)]),"","SOAP","S: "+S.so.s,"O: "+S.so.o,"A: "+S.so.a,"P: "+S.so.p,"",`Dibuat dengan aplikasi ${BRAND.initials}. Alat bantu belajar dan dokumentasi; keputusan klinis oleh perawat berwenang.`].join("\n")}
function v5(){return `<div class="card"><h2>Ekspor</h2><pre>${esc(docT())}</pre></div><div class="btns no"><button onclick="cp(this)">Salin teks</button><button onclick="window.print()">Cetak atau simpan PDF</button><button class="g" onclick="clr()">Hapus semua data</button></div>`}
function cp(b){try{navigator.clipboard.writeText(docT()).then(()=>b.textContent="Tersalin",()=>b.textContent="Gagal menyalin")}catch(e){b.textContent="Gagal menyalin"}}
function clr(){if(confirm("Hapus semua data kasus ini?")){try{localStorage.removeItem("askep_ldp")}catch(e){}S={step:0,f:{},dx:-1,sg:[],et:"",ou:[],iv:[],so:{}};render()}}
function go(n){if(n>1&&S.dx<0){alert("Pilih satu diagnosa terlebih dahulu.");n=1}if(n==4&&!S.so.s)mk();S.step=n;render()}
function render(k){$("#nav").innerHTML=ST.map((t,i)=>`<button class="${i==S.step?"on":i<S.step?"dn":""}" onclick="go(${i})"><i>${i+1}</i><span>${t}</span></button>`).join("");
$("#main").innerHTML=[v0,v1,v2,v3,v4,v5][S.step]()+(S.step<5?`<div class="btns no">${S.step?`<button class="g" onclick="go(S.step-1)">Sebelumnya</button>`:"<span></span>"}<button onclick="go(S.step+1)">Lanjut</button></div>`:`<div class="btns no"><button class="g" onclick="go(4)">Sebelumnya</button><span></span></div>`);
save();if(!k)scrollTo(0,0)}
function th(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"}
$("#lg").innerHTML=LOGO;$("#lg2").innerHTML=LOGO.replace('id="g"','id="g2"').replace("url(#g)","url(#g2)");
$("#ft").innerHTML=`© ${new Date().getFullYear()} ${esc(BRAND.fullName||BRAND.initials)}${BRAND.institution?", "+esc(BRAND.institution):""}. Dibuat oleh ${BRAND.initials}.<br>Alat bantu belajar dan dokumentasi, bukan pengganti penilaian klinis. Verifikasi kode dan isi dengan buku standar PPNI (SDKI, SLKI, SIKI) dan NANDA-I.`;
try{const v=localStorage.getItem("askep_ldp");if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}
if(S.step>1&&S.dx<0)S.step=1;
render(1);
setTimeout(()=>{const s=$("#sp");s.style.opacity=0;setTimeout(()=>s.remove(),500)},1900);
</script></body></html>
